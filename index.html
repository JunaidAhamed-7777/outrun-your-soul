<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14215a" />
    <meta name="description" content="Your body can outrun death. Your soul cannot." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Outrun" />
    <meta name="author" content="Junaid" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Outrun Your Soul" />
    <meta property="og:description" content="Your body can outrun death. Your soul cannot. A touch-first action roguelite on a funeral railway." />
    <meta property="og:image" content="https://outrun-your-soul.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://outrun-your-soul.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Outrun Your Soul" />
    <meta name="twitter:description" content="Your body can outrun death. Your soul cannot." />
    <meta name="twitter:image" content="https://outrun-your-soul.vercel.app/og.jpg" />
    <title>Outrun Your Soul</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14215a;
        color: #f4ecd8;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /* Boot screen: shown instantly from HTML, driven by src/game/boot.ts, removed once the title is ready. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 0 24px;
        background: radial-gradient(120% 70% at 50% 30%, #2443a3 0%, #14215a 62%, #0d1640 100%);
        font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        text-align: center;
        transition: opacity 0.5s ease;
      }
      #boot.is-done { opacity: 0; pointer-events: none; }
      #boot .mark { width: 84px; height: 84px; filter: drop-shadow(0 8px 18px rgba(5, 8, 30, 0.5)); margin-bottom: 6px; }
      #boot .k { letter-spacing: 0.32em; font-size: 12px; color: #d9a43c; text-transform: uppercase; font-family: system-ui, sans-serif; }
      #boot h1 { margin: 0; font-weight: 400; font-size: clamp(34px, 11vw, 56px); line-height: 1.02; letter-spacing: 0.06em; color: #f4ecd8; }
      #boot h1 span { display: block; font-size: 0.56em; letter-spacing: 0.3em; }
      #boot .track { position: relative; width: min(260px, 70vw); height: 18px; margin-top: 18px; }
      #boot .thread { position: absolute; left: 0; top: 8px; height: 2px; width: 0; background: #e8411f; border-radius: 2px; transition: width 0.25s ease-out; }
      #boot .body, #boot .soul { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; }
      #boot .body { left: 0; background: #f4ecd8; box-shadow: 0 0 0 2px #14215a; transition: left 0.25s ease-out; }
      /* The soul follows the same thread, more slowly. */
      #boot .soul { left: 0; background: #c9f2ff; box-shadow: 0 0 10px 3px rgba(92, 200, 255, 0.7); transition: left 1.4s ease-in-out; }
      #boot .status { min-height: 1.2em; font-size: 13px; color: rgba(244, 236, 216, 0.7); font-family: system-ui, sans-serif; }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot .thread, #boot .body, #boot .soul { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status" aria-live="polite">
      <img class="mark" src="./favicon.svg" alt="" width="84" height="84" />
      <div class="k">A funeral-railway escape</div>
      <h1>Outrun<span>your soul</span></h1>
      <div class="track" aria-hidden="true"><div class="thread"></div><div class="soul"></div><div class="body"></div></div>
      <div class="status">Loading the courtyard…</div>
    </div>
    <script>
      // If the game script never starts (e.g. only index.html was uploaded, or the files are
      // nested in a sub-folder of the ZIP), say so instead of showing a loading screen forever.
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (!boot || window.__oysScriptStarted) return;
        var s = boot.querySelector('.status');
        if (s) s.textContent = 'The game files did not load. Please reload; if you host this build, upload the whole ZIP with index.html at its top level.';
      }, 12000);
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
