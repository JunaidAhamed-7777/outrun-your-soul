<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Render Lab · Outrun Your Soul</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14215a;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
        color: #f4ecd8;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 6px;
        top: 6px;
        right: 6px;
        pointer-events: none;
        text-shadow: 0 1px 2px #000a;
      }
      #controls {
        position: fixed;
        left: 6px;
        right: 6px;
        bottom: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #controls button {
        font: inherit;
        color: #f4ecd8;
        background: #14215acc;
        border: 1px solid #f4ecd855;
        border-radius: 4px;
        padding: 4px 7px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">loading…</div>
    <div id="controls"></div>
    <script type="module" src="./src/render/lab/main.ts"></script>
  </body>
</html>
