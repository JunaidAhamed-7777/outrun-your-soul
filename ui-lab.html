<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>UI Lab — Outrun Your Soul</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14215a; }
      /* Stand-in for the 3D courtyard so overlay contrast can be judged. */
      #stage {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(120% 40% at 50% 0%, #f6d9a8 0%, #f0b97a 22%, transparent 42%),
          repeating-linear-gradient(0deg, transparent 0 46px, rgba(20, 33, 90, 0.5) 46px 48px),
          repeating-linear-gradient(90deg, transparent 0 46px, rgba(20, 33, 90, 0.5) 46px 48px),
          linear-gradient(180deg, #3f66cc 0%, #2443a3 40%, #1a2c78 100%);
      }
      #stage::after {
        content: '';
        position: absolute;
        left: 30%;
        top: 46%;
        width: 34%;
        height: 18%;
        border-left: 6px solid #e8411f;
        border-top: 6px solid #e8411f;
        border-radius: 4px;
        opacity: 0.8;
      }
      #lab {
        position: fixed;
        left: 6px;
        bottom: 6px;
        z-index: 100;
        width: min(360px, 94vw);
        max-height: 46vh;
        overflow: auto;
        background: rgba(0, 0, 0, 0.78);
        color: #eee;
        font: 12px/1.3 system-ui, sans-serif;
        border-radius: 8px;
        padding: 6px;
      }
      #lab.collapsed > details, #lab.collapsed > pre { display: none; }
      #lab summary { cursor: pointer; font-weight: 600; margin: 4px 0; }
      #lab button { margin: 2px; padding: 4px 6px; font: inherit; border-radius: 4px; border: 1px solid #666; background: #222; color: #eee; }
      #log { white-space: pre-wrap; max-height: 80px; overflow: auto; margin: 4px 0 0; color: #9c9; }
      #toggle-lab { position: sticky; top: 0; float: right; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="lab"><button id="toggle-lab" type="button">lab ▾</button><pre id="log"></pre></div>
    <script type="module" src="./src/ui/lab/lab.ts"></script>
  </body>
</html>
